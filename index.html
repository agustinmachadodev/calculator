<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="calculator">

            <div class="display">
                <div class="display-content">
                    <h1></h1>
                </div>
            </div>

            <div class="btn-container">
                <button class="operatorBtn btn-small">AC</button>
                <button class="operatorBtn btn-small">()</button>
                <button class="operatorBtn btn-small">%</button>
                <button class="operatorBtn btn-small divide">÷</button>
                
                <button class="numBtn">7</button>
                <button class="numBtn">8</button>
                <button class="numBtn">9</button>
                <button class="operatorBtn multiply">x</button>
                
                <button class="numBtn">4</button>
                <button class="numBtn">5</button>
                <button class="numBtn">6</button>
                <button class="operatorBtn substract">-</button>

                <button class="numBtn">1</button>
                <button class="numBtn">2</button>
                <button class="numBtn">3</button>
                <button class="operatorBtn add">+</button>
            
                <button class="numBtn">0</button>
                <button class="operatorBtn dotBtn">.</button>
                <button class="operatorBtn deleteBtn">⌫</button>
                <button class="operatorBtn equal">=</button>
            
            </div>
            
        </div>


        <script src="script.js"></script>
</body>
</html>
